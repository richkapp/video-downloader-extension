<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src http://127.0.0.1:9876;">
  <title>Media Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* Draggable title bar area */
    .titlebar {
      -webkit-app-region: drag;
      height: 38px;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .titlebar h1 {
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }

    .status-dot.running {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .status-text {
      font-size: 14px;
      color: #aaa;
    }

    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-app-region: no-drag;
    }

    .btn-start {
      background: #22c55e;
      color: #fff;
    }

    .btn-start:hover {
      background: #16a34a;
    }

    .btn-start:disabled {
      background: #4a4a4a;
      cursor: not-allowed;
    }

    .btn-stop {
      background: #ef4444;
      color: #fff;
    }

    .btn-stop:hover {
      background: #dc2626;
    }

    .btn-stop:disabled {
      background: #4a4a4a;
      cursor: not-allowed;
    }

    .spacer {
      flex: 1;
    }

    .extension-link {
      font-size: 12px;
      color: #888;
    }

    .extension-link a {
      color: #00d4ff;
      text-decoration: none;
    }

    .extension-link a:hover {
      text-decoration: underline;
    }

    .downloads-container {
      flex: 1;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .downloads-header {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
      font-weight: 500;
    }

    .downloads-iframe-container {
      flex: 1;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    .offline-message {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
      gap: 12px;
    }

    .offline-message.hidden {
      display: none;
    }

    .offline-icon {
      font-size: 48px;
      opacity: 0.5;
    }

    .active-downloads {
      color: #00d4ff;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <h1>Media Downloader</h1>
  </div>

  <div class="content">
    <div class="controls">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Checking...</span>
      </div>

      <button class="btn btn-start" id="startBtn" disabled>Start Server</button>
      <button class="btn btn-stop" id="stopBtn" disabled>Stop Server</button>

      <div class="spacer"></div>

      <div class="extension-link">
        Browser extension connects to localhost:9876
      </div>
    </div>

    <div class="downloads-container">
      <div class="downloads-header">
        Downloads
        <span class="active-downloads" id="activeCount"></span>
      </div>
      <div class="downloads-iframe-container">
        <iframe id="downloadsFrame" src="about:blank"></iframe>
        <div class="offline-message" id="offlineMessage">
          <div class="offline-icon">&#128268;</div>
          <p>Server is not running</p>
          <p>Click "Start Server" to begin</p>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
