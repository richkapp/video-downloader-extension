<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 400px;
      min-height: 200px;
      max-height: 500px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #1a1a2e;
      color: #eee;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1::before {
      content: "▶";
      color: #00d4ff;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .status.scanning {
      background: #2a2a4a;
      color: #aaa;
    }
    .status.found {
      background: #1a3a2a;
      color: #4ade80;
    }
    .status.none {
      background: #3a2a2a;
      color: #f87171;
    }
    .video-list {
      max-height: 350px;
      overflow-y: auto;
    }
    .video-item {
      background: #2a2a4a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .video-item:last-child {
      margin-bottom: 0;
    }
    .video-url {
      font-size: 11px;
      color: #888;
      word-break: break-all;
      margin-bottom: 8px;
      max-height: 40px;
      overflow: hidden;
    }
    .video-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .video-type {
      background: #00d4ff;
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .video-size {
      font-size: 12px;
      color: #aaa;
    }
    .download-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .download-btn:hover {
      opacity: 0.9;
    }
    .download-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
    .refresh-btn {
      width: 100%;
      padding: 8px;
      background: transparent;
      color: #00d4ff;
      border: 1px solid #00d4ff;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 12px;
    }
    .refresh-btn:hover {
      background: rgba(0, 212, 255, 0.1);
    }
    .tip {
      font-size: 11px;
      color: #666;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <h1>Media Downloader</h1>
  <div id="status" class="status scanning">Scanning page for media...</div>
  <div id="videoList" class="video-list"></div>
  <button id="refreshBtn" class="refresh-btn">Rescan Page</button>
  <button id="clearBtn" class="refresh-btn" style="margin-top: 6px; color: #f87171; border-color: #f87171;">Clear & Rescan</button>
  <div class="tip">
    Tip: Play the video/audio first, then click Rescan. The extension monitors network requests to find media streams.
  </div>
  <style>
    .server-instructions {
      background: #2a2a4a;
      border-radius: 8px;
      padding: 16px;
      font-size: 13px;
    }
    .server-instructions code {
      display: block;
      background: #1a1a2e;
      padding: 10px;
      border-radius: 4px;
      margin-top: 8px;
      font-size: 11px;
      word-break: break-all;
      color: #00d4ff;
    }
    .video-duration {
      background: #22c55e;
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .video-segments {
      color: #888;
      font-size: 11px;
    }
    .video-quality {
      background: #8b5cf6;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .video-est-size {
      background: #f59e0b;
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .audio-type {
      background: #a855f7;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .audio-item {
      border-left: 3px solid #a855f7;
    }
    .audio-item .download-btn {
      background: linear-gradient(135deg, #a855f7, #7c3aed);
    }
    .recommended {
      border: 1px solid #22c55e;
      position: relative;
    }
    .recommend-badge {
      background: #22c55e;
      color: #000;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .stream-label {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .recommended .download-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }
  </style>
  <script src="popup.js"></script>
</body>
</html>
